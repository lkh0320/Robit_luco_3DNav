# elevation 전용 octomap_server (layers.launch.py 의 elevation_source:=octomap, 기본)
# 2D 용 octomap(octomap.yaml)은 occupancy_max_z 0.8 에서 잘려서 그보다 높은 장애물이 빠짐
# -> 0.15 m 위 전부를 내보내는 것을 하나 더 띄우고 /elevation_octomap/octomap_point_cloud_centers 를 elevation_mapper 가 받음.
# octomap 은 광선이 지나간 voxel 을 비우므로 지나간 사람 자국이 실시간으로 지워진다.
# 입력: /fastlio2/body_cloud (base_footprint 기준, 범위 필터 적용된 스캔)
#   TF map -(PGO)-> lio_world -(FAST-LIO)-> base_footprint 로 map에 넣음
#   -> 넣는 순간의 PGO 보정만 반영. 루프가 닫혀도 이미 쌓인 voxel은 다시 정렬되지 않음
#   raycast 원점 = cloud 프레임 원점(base_footprint, 바닥). 라이다보다 0.37 m 아래라 free 공간이 약간 다름
/elevation_octomap/octomap_elevation:
  ros__parameters:
    frame_id: map
    base_frame_id: base_footprint
    resolution: 0.1
    sensor_model:
      max_range: 15.0      # 이 거리 넘는 점은 끝까지 raycast 하지 않음 (속도)
      hit: 0.7
      miss: 0.4
      min: 0.12
      max: 0.97
    # 넣을 점 범위 (map 기준 z). 천장 제외하려면 point_cloud_max_z 낮추기
    point_cloud_min_z: -1.0
    point_cloud_max_z: 2.5
    # 2D 투영(projected_map): 이 높이 범위(map z) 안의 occupied voxel만 장애물
    #   map z=0 = 시작 위치 바닥(base_footprint). 바닥 노이즈 피하려고 0.15부터, 로봇 키 + 여유까지
    occupancy_min_z: 0.15   # 바닥 위 장애물만 (바닥은 elevation_mapper 가 누적, floor_split 과 같게)
    occupancy_max_z: 2.5    # 높이 제한은 elevation_mapper 가 로봇 기준으로 함
    filter_ground_plane: false
    filter_speckles: true
    publish_free_space: false
    incremental_2D_projection: false   # true면 jazzy octomap_server에서 projected_map이 전부 unknown으로 나옴
    compress_map: true
    latch: true    # transient_local: bag 끝/SLAM 정지 후에도 save_maps가 마지막 맵을 받음
