ebimu_imu_node:
  ros__parameters:
    port: /dev/ttyUSB0          # udev 규칙 설치 후에는 /dev/ebimu
    baudrate: 115200
    frame_id: imu_link
    topic: /imu/data
    # 센서 실제 출력: *qz,qy,qx,qw, gx,gy,gz(deg/s), ax,ay,az(g), timestamp
    orientation_format: quaternion   # euler | quaternion | none
    gyro_unit: deg                   # deg | rad
    accel_unit: g                    # g | mps2 (중력 포함이어야 함)
    init_commands: [""]              # 시작 시 센서에 보낼 설정 명령 (비우면 안 건드림)
    print_raw_lines: 5
