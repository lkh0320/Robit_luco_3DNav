velodyne_driver_node:
  ros__parameters:
    device_ip: 192.168.1.201
    port: 2368
    model: VLP16
    rpm: 600.0
    frame_id: velodyne
    gps_time: false
    time_offset: 0.0
    enabled: true
    read_once: false
    read_fast: false
    repeat_delay: 0.0
    timestamp_first_packet: false

velodyne_transform_node:
  ros__parameters:
    model: VLP16
    min_range: 0.9
    max_range: 130.0
    view_direction: 0.0
    fixed_frame: ""
    target_frame: ""
    organize_cloud: true
    # calibration 경로는 launch에서 velodyne_pointcloud/params/VLP16db.yaml 로 채움
